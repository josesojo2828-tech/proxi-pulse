{{define "content"}}
<div class="visits-page">
    <div class="page-header">
        <h2>Visits</h2>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>IP</th>
                    <th>Country</th>
                    <th>Path</th>
                    <th>Method</th>
                    <th>Status</th>
                    <th>Latency (ms)</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody id="visitsBody">
                <tr><td colspan="7" class="empty">Loading visits...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" id="pagination" style="display:none">
        <button class="btn btn-sm" id="prevPage">Previous</button>
        <span class="page-info" id="pageInfo"></span>
        <button class="btn btn-sm" id="nextPage">Next</button>
    </div>

    <div id="visitsError" class="error" style="display:none"></div>
</div>

<script>
    const tbody = document.getElementById('visitsBody');
    const pagination = document.getElementById('pagination');
    const pageInfo = document.getElementById('pageInfo');

    let currentPage = 1;
    let totalPages = 1;
    const limit = 20;

    document.getElementById('prevPage').onclick = () => goToPage(currentPage - 1);
    document.getElementById('nextPage').onclick = () => goToPage(currentPage + 1);

    async function loadVisits() {
        const resp = await fetch('/api/stats/visits?page=' + currentPage + '&limit=' + limit).then(r => r.json());
        if (!resp.ok) {
            document.getElementById('visitsError').textContent = resp.error;
            document.getElementById('visitsError').style.display = '';
            return;
        }
        totalPages = Math.ceil(resp.data.total / limit) || 1;
        tbody.innerHTML = resp.data.visits.map(v => {
            const lat = v.latency_ms ? v.latency_ms.toFixed(1) : '-';
            const ts = v.created_at ? new Date(v.created_at).toLocaleString() : '-';
            const statusClass = v.status_code < 400 ? 'status-ok' : 'status-err';
            return `<tr>
                <td>${escHtml(v.ip)}</td>
                <td>${v.country || '-'}</td>
                <td>${escHtml(v.path)}</td>
                <td><span class="badge method-${v.method.toLowerCase()}">${escHtml(v.method)}</span></td>
                <td><span class="badge ${statusClass}">${v.status_code}</span></td>
                <td>${lat}</td>
                <td>${ts}</td>
            </tr>`;
        }).join('');

        if (totalPages > 1) {
            pagination.style.display = '';
            pageInfo.textContent = 'Page ' + currentPage + ' of ' + totalPages;
            document.getElementById('prevPage').style.display = currentPage > 1 ? '' : 'none';
            document.getElementById('nextPage').style.display = currentPage < totalPages ? '' : 'none';
        } else {
            pagination.style.display = 'none';
        }
    }

    function goToPage(page) {
        currentPage = page;
        tbody.innerHTML = '<tr><td colspan="7" class="empty">Loading...</td></tr>';
        loadVisits();
    }

    function escHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    loadVisits();
</script>
{{end}}
