{{define "content"}}
<div class="geo-page" x-data="geoData()" x-init="initMap()">
    <div class="page-header">
        <h2>Geographic Traffic</h2>
    </div>

    <div class="geo-stats" x-show="countries.length > 0">
        <table class="geo-table">
            <thead>
                <tr>
                    <th>Country</th>
                    <th>Visits</th>
                    <th>Share</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="c in countries" :key="c.country">
                    <tr>
                        <td x-text="c.country || 'Unknown'"></td>
                        <td x-text="c.count"></td>
                        <td>
                            <div class="bar-container">
                                <div class="bar" :style="'width: ' + (c.count / maxCount * 100) + '%'"></div>
                                <span class="bar-label" x-text="(c.count / totalVisits * 100).toFixed(1) + '%'"></span>
                            </div>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <div id="map" class="map-container"></div>

    <div x-show="loading" class="loading">Loading geo data...</div>
    <div x-show="error" class="error" x-text="error"></div>
</div>

<script>
    function geoData() {
        return {
            countries: [],
            totalVisits: 0,
            maxCount: 0,
            loading: true,
            error: '',
            map: null,
            async initMap() {
                try {
                    const resp = await fetch('/api/stats/countries').then(r => r.json());
                    if (resp.ok) {
                        this.countries = resp.data;
                        this.totalVisits = this.countries.reduce((sum, c) => sum + c.count, 0);
                        this.maxCount = Math.max(...this.countries.map(c => c.count), 1);
                    }
                } catch (e) {
                    this.error = 'Failed to load geo data';
                } finally {
                    this.loading = false;
                    setTimeout(() => {
                        this.map = L.map('map').setView([20, 0], 2);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                            attribution: '&copy; OpenStreetMap contributors',
                            maxZoom: 18
                        }).addTo(this.map);

                        // Approximate country coordinates for markers
                        const coords = {
                            'US': [37.09, -95.71], 'GB': [55.38, -3.44], 'DE': [51.17, 10.45],
                            'FR': [46.23, 2.21], 'JP': [36.20, 138.25], 'BR': [-14.24, -51.93],
                            'CA': [56.13, -106.35], 'AU': [-25.27, 133.78], 'IN': [20.59, 78.96],
                            'CN': [35.86, 104.20], 'RU': [61.52, 105.32], 'ZA': [-30.56, 22.94],
                            'AR': [-38.42, -63.62], 'MX': [23.63, -102.55], 'KR': [35.91, 127.77],
                            'SE': [60.13, 18.64], 'NL': [52.13, 5.29], 'IT': [41.87, 12.57],
                            'ES': [40.46, -3.75], 'SG': [1.35, 103.82]
                        };

                        this.countries.forEach(c => {
                            const pos = coords[c.country];
                            if (pos) {
                                const radius = Math.max(5, Math.min(30, c.count / this.maxCount * 30));
                                L.circleMarker(pos, {
                                    radius: radius,
                                    fillColor: '#00d4aa',
                                    color: '#00d4aa',
                                    weight: 1,
                                    opacity: 0.8,
                                    fillOpacity: 0.4
                                }).addTo(this.map)
                                .bindTooltip(c.country + ': ' + c.count + ' visits');
                            }
                        });
                    });
                }
            }
        };
    }
</script>
{{end}}
